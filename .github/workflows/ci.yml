name: Repository checks
on:
  push:
  pull_request:
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure private assets are not committed
        run: |
          ! find . -type f \( -name '*.exe' -o -name '*.ogg' -o -name '*.mo3' -o -name '*.pack.json' \) | grep .
